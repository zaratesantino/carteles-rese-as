<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a Google Maps...</title>
  <script>
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQyqVQWxwf_ulEvqzajl2C8mu1ius7MGoQe-lQMTJmgH5EfLOhBr3m9IxecBzHAqqW222_C-XT4AXLo/pub?gid=0&single=true&output=csv";
    
    const params = new URLSearchParams(window.location.search);
    const idBuscado = (params.get("id") || "1").trim();

    fetch(SHEET_CSV_URL, { cache: "no-store" })
      .then(res => res.text())
      .then(csv => {
        const filas = csv.split(/\r?\n/);
        for (let i = 0; i < filas.length; i++) {
          // Soporta separación por coma (,) o punto y coma (;)
          const cols = filas[i].split(/[,;]/);
          if (cols.length >= 2) {
            const idFila = cols[0].replace(/^"|"$/g, '').trim();
            // Acepta que pongas "1" o "ID-001" en la columna A del Excel
            if (idFila === idBuscado || idFila === "ID-" + idBuscado.padStart(3, '0')) {
              let destino = cols[1].replace(/^"|"$/g, '').trim();
              if (destino) {
                if (!destino.startsWith("http")) destino = "https://" + destino;
                window.location.replace(destino);
                return;
              }
            }
          }
        }
        document.getElementById("msg").innerText = "ID " + idBuscado + " no encontrado en la Columna A del Excel.";
      })
      .catch(err => {
        document.getElementById("msg").innerText = "Error al leer el Excel.";
      });
  </script>
</head>
<body style="font-family:sans-serif; display:flex; height:90vh; align-items:center; justify-content:center; color:#444; text-align:center; padding:20px;">
  <div id="msg">Abriendo reseñas de Google...</div>
</body>
</html>
