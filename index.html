<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps · Reseñas</title>
  <link rel="preconnect" href="https://docs.google.com">
  <link rel="preconnect" href="https://corsproxy.io">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 92vh;
      text-align: center;
      padding: 20px;
    }
    .g-logo { font-size: 34px; font-weight: 700; letter-spacing: -1px; margin-bottom: 4px; }
    .g-b { color: #4285F4; } .g-r { color: #EA4335; } .g-y { color: #FBBC05; } .g-g { color: #34A853; }
    .stars { color: #FBBC05; font-size: 22px; letter-spacing: 3px; margin-bottom: 18px; }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3.5px solid #e8eaed;
      border-top: 3.5px solid #4285F4;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
      margin-bottom: 14px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .status { font-size: 14px; color: #5f6368; font-weight: 500; }
  </style>
  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQyqVQWxwf_ulEvqzajl2C8mu1ius7MGoQe-lQMTJmgH5EfLOhBr3m9IxecBzHAqqW222_C-XT4AXLo/pub?gid=0&single=true&output=csv";
    const params = new URLSearchParams(window.location.search);
    const idBuscado = (params.get("id") || "1").trim();

    function transformarEnUrlResena(celda) {
      if (!celda) return null;
      // Limpiamos comillas o espacios extras
      let valor = celda.split("|")[0].replace(/[\[\]\(\)"]/g, "").trim();
      if (!valor) return null;

      // 1. Si pegaste el Place ID directo (ej: ChIJSw57_BiptZUR97VYXC0RZrY)
      if (/^ChIJ[a-zA-Z0-9_-]+$/.test(valor)) {
        return "https://search.google.com/local/writereview?placeid=" + valor;
      }

      // 2. Si adentro del texto hay un Place ID (ChIJ...)
      const matchPlaceId = valor.match(/ChIJ[a-zA-Z0-9_-]+/);
      if (matchPlaceId) {
        return "https://search.google.com/local/writereview?placeid=" + matchPlaceId[0];
      }

      // 3. Si ya es una URL normal (http / https)
      const matchHttp = valor.match(/https?:\/\/[^\s"<>]+/i);
      if (matchHttp) return matchHttp[0];

      if (valor.includes(".")) return "https://" + valor;
      return null;
    }

    function buscarYRedirigir(csvText) {
      if (!csvText || csvText.trim().startsWith("<!DOCTYPE")) throw new Error("Invalido");
      const filas = csvText.split(/\r?\n/);
      for (let i = 0; i < filas.length; i++) {
        const cols = filas[i].split(/[,;]/);
        if (cols.length >= 2) {
          const idFila = cols[0].replace(/^"|"$/g, '').trim();
          if (idFila === idBuscado || idFila === "ID-" + idBuscado.padStart(3, '0')) {
            const urlFinal = transformarEnUrlResena(cols[1]);
            if (urlFinal) {
              window.location.replace(urlFinal);
              return true;
            }
          }
        }
      }
      throw new Error("No encontrado");
    }

    async function obtenerRuta(url) {
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("Error HTTP");
      const text = await res.text();
      buscarYRedirigir(text);
    }

    Promise.any([
      obtenerRuta(CSV_URL + "&_t=" + Date.now()),
      obtenerRuta("https://corsproxy.io/?" + encodeURIComponent(CSV_URL)),
      obtenerRuta("https://api.allorigins.win/raw?url=" + encodeURIComponent(CSV_URL))
    ]).catch(() => {
      document.getElementById("msg").innerText = "Error: Revisá la fila " + idBuscado + " en tu Excel.";
    });
  </script>
</head>
<body>
  <div class="g-logo">
    <span class="g-b">G</span><span class="g-r">o</span><span class="g-y">o</span><span class="g-b">g</span><span class="g-g">l</span><span class="g-r">e</span>
  </div>
  <div class="stars">★★★★★</div>
  <div class="spinner"></div>
  <div class="status" id="msg">Abriendo ventana de reseña...</div>
</body>
</html>
